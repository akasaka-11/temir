<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1 stops iOS from zooming in when an input gets focus; viewport-fit=cover lets the
         app draw under the notch (safe areas are handled by react-native-safe-area-context). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Temir</title>
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- Home screen app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Temir" />
    <!-- The react-native-web recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #000000;
      }
      body {
        overflow: hidden;
        /* No bounce/pull-to-refresh of the whole page and no grey tap flash. */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Offline support: cache the app after the first visit (see public/sw.js).
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
